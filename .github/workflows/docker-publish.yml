name: H2C Release

on:
  push:
    tags:
      - "v*-h2c*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag (vYYYY.M.P-h2c.N)
        required: true
        type: string

permissions:
  contents: read

# All versions share latest-h2c. Never interrupt a partially published release.
concurrency:
  group: h2c-publication
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: inherent-design/cloudflared

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Validate release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            tag="${INPUT_TAG}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+-h2c\.[0-9]+$ ]]; then
            echo 'Expected release tag vYYYY.M.P-h2c.N' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout release tag
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - name: Resolve immutable release source
        id: release
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - name: Install pinned linter
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      - name: Allow unprivileged ICMP
        run: sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - name: Test and lint selected source
        run: make SHELL=bash '.SHELLFLAGS=-e -o pipefail -c' test lint
      - name: Verify module locks
        run: git diff --exit-code -- go.mod go.sum

  build-binaries:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - name: Build and verify binary
        shell: bash
        run: |
          make VERSION="$RELEASE_VERSION" TARGET_OS=linux TARGET_ARCH="$ARCH" cloudflared
          mv cloudflared "cloudflared-linux-$ARCH"
          go version -m "cloudflared-linux-$ARCH" | tee version.txt
          grep -F "main.Version=$RELEASE_VERSION" version.txt
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: cloudflared-linux-${{ matrix.arch }}
          path: cloudflared-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-and-scan:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.0.0
      - name: Build image archive without publishing
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          pull: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
          build-args: VERSION=${{ needs.resolve.outputs.version }}
          outputs: type=docker,dest=image.tar
          cache-from: type=gha,scope=h2c-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=h2c-${{ matrix.arch }}
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - name: Verify image binary and architecture
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          docker load --input image.tar
          ref="$REGISTRY/$IMAGE_NAME:$RELEASE_VERSION-$ARCH"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$ARCH"
          container=$(docker create "$ref")
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/usr/local/bin/cloudflared" ./image-binary
          go version -m image-binary | tee image-version.txt
          grep -F "main.Version=$RELEASE_VERSION" image-version.txt
          grep -F "GOOS=linux" image-version.txt
          grep -F "GOARCH=$ARCH" image-version.txt
      - name: Scan exact archive before publication
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          input: image.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          scanners: vuln
          severity: CRITICAL,HIGH
      - name: Record archive checksum
        run: sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: image-${{ matrix.arch }}
          path: |
            image.tar
            image.tar.sha256
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: [resolve, check, build-binaries, build-and-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Checkout and verify release tag still identifies tested source
        uses: actions/checkout@v6.0.2
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          persist-credentials: false
      - name: Check immutable source
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Download scanned image archives
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: image-*
          path: images
      - name: Download binary artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: cloudflared-linux-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify both archives and load without rebuilding
        shell: bash
        run: |
          for arch in amd64 arm64; do
            (cd "images/image-$arch" && sha256sum --check image.tar.sha256)
            docker load --input "images/image-$arch/image.tar"
            ref="$REGISTRY/$IMAGE_NAME:$RELEASE_VERSION-$arch"
            test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$arch"
            test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$RELEASE_SHA"
            docker image inspect "$ref" --format '{{.Id}}' > "images/image-$arch/image.id"
          done
      - uses: docker/setup-buildx-action@v4.0.0
      - uses: docker/login-action@v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push scanned images and verify registry identities
        shell: bash
        run: |
          for arch in amd64 arm64; do
            ref="$REGISTRY/$IMAGE_NAME:$RELEASE_VERSION-$arch"
            docker push --platform "linux/$arch" "$ref"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            immutable="$REGISTRY/$IMAGE_NAME@$digest"
            docker buildx imagetools inspect "$immutable" --raw > "images/image-$arch/manifest.json"
            test "$(jq -r '.config.digest' "images/image-$arch/manifest.json")" = "$(cat "images/image-$arch/image.id")"
            echo "$immutable" > "images/image-$arch/reference"
          done
      - name: Publish multi-platform tags from verified digests
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$IMAGE_NAME:$RELEASE_VERSION" \
            --tag "$REGISTRY/$IMAGE_NAME:latest-h2c" \
            "$(cat images/image-amd64/reference)" \
            "$(cat images/image-arm64/reference)"
      - name: Generate checksums and release notes
        shell: bash
        run: |
          (cd release-artifacts && sha256sum cloudflared-linux-amd64 cloudflared-linux-arm64 > SHA256SUMS)
          cat > release-notes.md <<NOTES
          Fork h2c release for cloudflared.

          Source: $RELEASE_SHA
          Container image: $REGISTRY/$IMAGE_NAME:$RELEASE_VERSION

          Selected source passed Linux tests and lint. Both image architectures
          passed fixable HIGH/CRITICAL OS and library vulnerability gates before publication.
          Assets: cloudflared-linux-amd64, cloudflared-linux-arm64, SHA256SUMS
          NOTES
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --repo "$GITHUB_REPOSITORY" --title "$RELEASE_VERSION" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            release-artifacts/cloudflared-linux-amd64 \
            release-artifacts/cloudflared-linux-arm64 \
            release-artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
